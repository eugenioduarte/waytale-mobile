name: "🧭 Epic"
description: A large body of work spanning multiple stories/tasks
title: "[EPIC] "
labels: ["epic"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What is this epic about, in a couple of sentences?
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal / Why
      description: What outcome does this unlock for the user or the product?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What's in scope and what's explicitly out of scope?
      placeholder: |
        In scope:
        -

        Out of scope:
        -
    validations:
      required: false
  - type: textarea
    id: success
    attributes:
      label: Success criteria
      description: How do we know this epic is done?
    validations:
      required: false
  - type: textarea
    id: stories
    attributes:
      label: Stories / tasks
      description: Checklist of child issues (link them once created, e.g. `- [ ] #12`)
      placeholder: |
        - [ ] #
        - [ ] #
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: Notes / open questions
    validations:
      required: false
