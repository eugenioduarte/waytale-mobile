# Storybook preview per PR (01.7).
#
# A PR that touches components (or the Storybook config) gets the web Storybook built and
# published to GitHub Pages under /pr-<number>/, with the link in a PR comment that is updated on
# every push. Closing the PR removes its preview.
#
# One-time setup: Settings → Pages → Source "Deploy from a branch" → `gh-pages` / root (the branch
# is created by the first run).

name: Storybook preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'apps/mobile/src/**'
      - 'apps/mobile/.storybook/**'
      - 'apps/mobile/.rnstorybook/**'
      - 'apps/mobile/package.json'
      - 'packages/ui/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/storybook-preview.yml'

concurrency:
  group: storybook-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write # push to gh-pages
  pull-requests: write # comment the link

env:
  PREVIEW_DIR: pr-${{ github.event.pull_request.number }}
  PREVIEW_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}/

jobs:
  publish:
    # Forks get a read-only token: they can't push previews.
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Every story must render with the global decorators before it is published.
      - run: pnpm --filter mobile exec jest src/storybook

      - run: pnpm --filter mobile storybook:build

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: apps/mobile/storybook-static
          destination_dir: ${{ env.PREVIEW_DIR }}
          keep_files: true # other PRs' previews stay
          enable_jekyll: false
          commit_message: 'Storybook preview for #${{ github.event.pull_request.number }}'

      - uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- storybook-preview -->';
            const body = [
              marker,
              `📚 **Storybook preview:** ${process.env.PREVIEW_URL}`,
              '',
              `Built from ${context.payload.pull_request.head.sha.slice(0, 7)}. ` +
                'GitHub Pages can take a minute to serve a new version.',
            ].join('\n');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove this PR's preview from gh-pages
        run: |
          git fetch origin gh-pages || { echo "No gh-pages branch yet"; exit 0; }
          git checkout gh-pages
          if [ ! -d "$PREVIEW_DIR" ]; then echo "No preview to remove"; exit 0; fi
          git rm -r --quiet "$PREVIEW_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "Remove Storybook preview for #${{ github.event.pull_request.number }}"
          git push origin gh-pages
